# cmd_229 AC6a — live modal capture provenance (2026-08-16, ashigaru3)
#
# Captured with a real `claude --dangerously-skip-permissions` process
# (Claude Code v2.1.233) in a Test-Rules-5-compliant scratch tmux session
# (`scratch_ashigaru3_cmd229_modal`, self-terminating `timeout -s HUP 1800
# bash`, closed via `send-keys exit Enter` after capture — no kill/pkill
# used), pane width 54 (ashigaru3's production width, per gunshi_report.yaml
# AC6b measured_table). All captures via `tmux capture-pane -t <pane> -p -J`.
#
# The byte-exact fixture text (welcome screen, the real AskUserQuestion
# modal, and the derived G1/G2/G7/G6/G8/G9 specimens) lives in
# tests/unit/test_cmd229_detector_fixes.bats as WELCOME_CAPTURE /
# G1_CAPTURE / G2_CAPTURE / G7_CAPTURE / G6_CAPTURE — embedding raw
# terminal screen text (with its varying leading whitespace) here as YAML
# scalars is fragile to indentation rules, so this file stays prose-only
# and points at the bats file as the single source of truth for bytes.

specimen_1_welcome_screen:
  purpose: >-
    TC-GATE-04 / decision_rule_if_welcome_is_unknown. Verdict measured:
    SAFE (the bottom hint row contains "bypass permissions on", which is
    the pane_input_safety() safe anchor — the row survives at width 54
    without truncation; gunshi_report.yaml's width-49 truncation finding
    does not apply here). R2 (send_startup_prompt) is NOT restricted to
    the legacy binary gate.
  source: real, unmodified live capture
  where_the_bytes_live: "tests/unit/test_cmd229_detector_fixes.bats — WELCOME_CAPTURE"

specimen_2_modal_no_queued_input:
  purpose: >-
    Triggered by prompting the nested claude instance to call the
    AskUserQuestion tool ("pick a color: red/blue/green"). Same UI
